
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Name}} - My Pokédex</title>
    <meta name="referrer" content="no-referrer">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            color: #333;
        }

        .pokemon-card {
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .pokemon-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .pokemon-id {
            color: #888;
            font-size: 14px;
        }

        .pokemon-name {
            margin: 8px 0;
            font-size: 32px;
            text-transform: capitalize;
        }

        .pokemon-image {
            display: block;
            width: 180px;
            height: 240px;
            margin: 0 auto;
            object-fit: contain;
        }

        .pokemon-types {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .type {
            padding: 6px 14px;
            border-radius: 20px;
            background: #e5e7eb;
            font-size: 13px;
            text-transform: capitalize;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .pokemon-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .stat {
            padding: 15px;
            background: #f7f8fa;
            border-radius: 10px;
        }

        .stat-label {
            display: block;
            color: #888;
            font-size: 13px;
            margin-bottom: 6px;
            text-transform: capitalize;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }

        .back-link,
        .next-link,
        .prev-link {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
        }

        .back-link:hover,
        .next-link:hover,
        .prev-link:hover {
            text-decoration: underline;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }
    </style>
</head>

<body>

    <div class="pokemon-card">

        <div class="pokemon-header">
            <span class="pokemon-id">#{{.ID}}</span>

            <h1 class="pokemon-name">{{.Name}}</h1>

            <img
                class="pokemon-image"
                src="{{.Sprites.Other.OfficialArtwork.FrontDefault}}"
                alt="{{.Name}}"
            >

            <div class="pokemon-types">
                {{range .Types}}
                    <span class="type">{{.Type.Name}}</span>
                {{end}}
            </div>
        </div>

        <h2>About</h2>

        <div class="pokemon-info">
            <div class="stat">
                <span class="stat-label">Height</span>
                <span class="stat-value">{{.Height}}</span>
            </div>

            <div class="stat">
                <span class="stat-label">Weight</span>
                <span class="stat-value">{{.Weight}}</span>
            </div>
        </div>

        <h2>Base Stats</h2>

        <div class="pokemon-info">
            {{range .Stats}}
                <div class="stat">
                    <span class="stat-label">{{.Stat.Name}}</span>
                    <span class="stat-value">{{.BaseStat}}</span>
                </div>
            {{end}}
        </div>

        <a href="/pokemon" class="back-link">← Back to Pokédex</a>

        <div class="navigation">
            {{if gt .PrevID 0}}
                <a href="/pokemon/{{.PrevID}}" class="prev-link">
                    ← Previous Pokémon
                </a>
            {{end}}

            <a href="/pokemon/{{.NextID}}" class="next-link">
                Next Pokémon →
            </a>
        </div>

    </div>

</body>
</html>
